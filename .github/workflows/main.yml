name: Build umodel Linux
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu‑latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt‑get update
          sudo apt‑get install‑y gcc make libsdl2‑dev zlib1g‑dev libpng‑dev git perl

      
      - name: Compile
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload binary
        uses: actions/upload‑artifact@v4
        with:
          name: umodel‑linux
          path: umodel
