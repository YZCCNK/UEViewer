name: Build umodel Linux i386
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Enable i386 multiarch
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update

      - name: Install 32bit build dependencies
        run: |
          sudo apt-get install -y gcc make git perl gcc-multilib
          sudo apt-get install -y libsdl2-dev:i386 zlib1g-dev:i386 libpng-dev:i386

      - name: Compile i386
        run: |
          chmod +x build.sh
          export CFLAGS="-m32"
          export CXXFLAGS="-m32"
          export LDFLAGS="-m32"
          ./build.sh linux

      - name: Find compiled binary
        run: find . -name "umodel" -type f

      - name: Verify binary arch
        run: file umodel

      - name: Upload i386 binary
        uses: actions/upload-artifact@v5
        with:
          name: umodel-linux-i386
          path: umodel
